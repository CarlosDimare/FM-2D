<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background container -->
  <rect width="512" height="512" rx="88" fill="#090d16"/>
  
  <!-- Vertical Pitch Background -->
  <rect x="64" y="44" width="384" height="424" rx="36" fill="#065f46" stroke="#ffffff" stroke-width="8" stroke-opacity="0.9"/>
  
  <!-- Pitch Mowing Stripes -->
  <rect x="64" y="44" width="384" height="70.6" fill="#047857" opacity="0.6"/>
  <rect x="64" y="185.2" width="384" height="70.6" fill="#047857" opacity="0.6"/>
  <rect x="64" y="326.4" width="384" height="70.6" fill="#047857" opacity="0.6"/>

  <!-- Center Line & Circle -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="56" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff" stroke-opacity="0.8"/>

  <!-- Top Penalty Box (Opponent Goal) -->
  <path d="M 170 44 V 114 H 342 V 44" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
  <path d="M 212 44 V 70 H 300 V 44" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
  <circle cx="256" cy="92" r="5" fill="#ffffff"/>

  <!-- Bottom Penalty Box (Our Goal) -->
  <path d="M 170 468 V 398 H 342 V 468" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
  <path d="M 212 468 V 442 H 300 V 468" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
  <circle cx="256" cy="420" r="5" fill="#ffffff"/>

  <!-- 4-3-3 Formation Player Dots (Red & Black) -->
  <!-- Goalkeeper (1) -->
  <circle cx="256" cy="438" r="15" fill="#dc2626" stroke="#000000" stroke-width="5"/>
  <circle cx="256" cy="438" r="5" fill="#000000"/>
  
  <!-- Defenders (4): LB, CB, CB, RB -->
  <circle cx="128" cy="352" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
  <circle cx="202" cy="362" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
  <circle cx="310" cy="362" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
  <circle cx="384" cy="352" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>

  <!-- Midfielders (3): LCM, CDM, RCM -->
  <circle cx="182" cy="256" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
  <circle cx="256" cy="234" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
  <circle cx="330" cy="256" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>

  <!-- Forwards (3): LW, ST, RW -->
  <circle cx="150" cy="140" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
  <circle cx="256" cy="114" r="15" fill="#dc2626" stroke="#000000" stroke-width="5"/>
  <circle cx="362" cy="140" r="14" fill="#dc2626" stroke="#000000" stroke-width="4.5"/>
</svg>
