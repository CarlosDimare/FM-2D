<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background container -->
  <rect width="192" height="192" rx="32" fill="#090d16"/>
  
  <!-- Vertical Pitch Background -->
  <rect x="24" y="16" width="144" height="160" rx="16" fill="#065f46" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9"/>
  
  <!-- Pitch Mowing Stripes -->
  <rect x="24" y="16" width="144" height="26.6" fill="#047857" opacity="0.6"/>
  <rect x="24" y="69.2" width="144" height="26.6" fill="#047857" opacity="0.6"/>
  <rect x="24" y="122.4" width="144" height="26.6" fill="#047857" opacity="0.6"/>

  <!-- Center Line & Circle -->
  <line x1="24" y1="96" x2="168" y2="96" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="96" cy="96" r="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="96" cy="96" r="3" fill="#ffffff" stroke-opacity="0.8"/>

  <!-- Top Penalty Box (Opponent Goal) -->
  <path d="M 64 16 V 42 H 128 V 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 80 16 V 26 H 112 V 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="96" cy="34" r="2" fill="#ffffff"/>

  <!-- Bottom Penalty Box (Our Goal) -->
  <path d="M 64 176 V 150 H 128 V 176" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 80 176 V 166 H 112 V 176" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="96" cy="158" r="2" fill="#ffffff"/>

  <!-- 4-3-3 Formation Player Dots (Red & Black) -->
  <!-- Goalkeeper (1) -->
  <circle cx="96" cy="164" r="6" fill="#dc2626" stroke="#000000" stroke-width="2.5"/>
  <circle cx="96" cy="164" r="2" fill="#000000"/>
  
  <!-- Defenders (4): LB, CB, CB, RB -->
  <circle cx="48" cy="132" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
  <circle cx="76" cy="136" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
  <circle cx="116" cy="136" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
  <circle cx="144" cy="132" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>

  <!-- Midfielders (3): LCM, CDM, RCM -->
  <circle cx="68" cy="96" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
  <circle cx="96" cy="88" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
  <circle cx="124" cy="96" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>

  <!-- Forwards (3): LW, ST, RW -->
  <circle cx="56" cy="52" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
  <circle cx="96" cy="42" r="6" fill="#dc2626" stroke="#000000" stroke-width="2.5"/>
  <circle cx="136" cy="52" r="5.5" fill="#dc2626" stroke="#000000" stroke-width="2"/>
</svg>
